<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#fff0e0" rx="16"/>
  <!-- Fondo cielo -->
  <rect width="300" height="130" fill="#ffd9b0" rx="0"/>
  <!-- Humo -->
  <circle cx="148" cy="58" r="18" fill="#cccccc" opacity=".6"/>
  <circle cx="158" cy="42" r="14" fill="#bbbbbb" opacity=".5"/>
  <circle cx="145" cy="30" r="10" fill="#aaaaaa" opacity=".4"/>
  <!-- Volcán -->
