  <ellipse cx="60" cy="40" rx="40" ry="18" fill="white" opacity=".8"/>
  <ellipse cx="90" cy="35" rx="28" ry="16" fill="white" opacity=".8"/>
  <!-- Colinas verdes -->
  <ellipse cx="80" cy="185" rx="110" ry="45" fill="#b5e4b5"/>
  <ellipse cx="230" cy="190" rx="100" ry="40" fill="#9ed69e"/>
