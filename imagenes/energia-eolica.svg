  <polygon points="148,90 152,90 155,170 145,170" fill="#aab8c8"/>
  <!-- Aspas -->
  <line x1="150" y1="90" x2="150" y2="40" stroke="#ddeeff" stroke-width="10" stroke-linecap="round"/>
  <line x1="150" y1="90" x2="108" y2="116" stroke="#ddeeff" stroke-width="10" stroke-linecap="round"/>
  <line x1="150" y1="90" x2="192" y2="116" stroke="#ddeeff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="150" cy="90" r="7" fill="#5B4BDB"/>
  <!-- Líneas de viento -->
  <path d="M20 70 Q50 65 80 70" fill="none" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 82 Q45 76 75 82" fill="none" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <text x="150" y="193" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a5a9a" font-weight="bold">Energía eólica</text>
