<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#dceeff" rx="16"/>
  <!-- Montaña -->
  <polygon points="120,155 180,70 240,155" fill="#8fa8c8"/>
  <polygon points="175,85 195,125 155,125" fill="white" opacity=".7"/>
  <!-- Mar -->
  <rect x="0" y="155" width="300" height="45" rx="0" fill="#4a90d9" opacity=".7"/>
  <!-- Sol -->
  <circle cx="248" cy="38" r="22" fill="#f9cb6b" opacity=".9"/>
  <!-- Flechas evaporación -->
  <path d="M60 155 Q40 100 70 60" fill="none" stroke="#4a90d9" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <!-- Nube -->
  <ellipse cx="90" cy="52" rx="35" ry="20" fill="white"/>
  <ellipse cx="70" cy="58" rx="22" ry="16" fill="white"/>
  <ellipse cx="112" cy="58" rx="22" ry="16" fill="white"/>
  <!-- Lluvia -->
  <line x1="78" y1="76" x2="72" y2="92" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="76" x2="84" y2="92" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
  <line x1="102" y1="76" x2="96" y2="92" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a5a9a" font-weight="bold">Ciclo del agua</text>
</svg>
