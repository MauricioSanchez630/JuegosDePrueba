<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrar juegos · Aula Play</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   VARIABLES Y RESET (homologado con index.html)
═══════════════════════════════════════════════════════════════ */
:root {
  --site-primary:#5B4BDB;
  --site-primary-dark:#4538b8;
  --site-primary-light:#7c6ff0;
  --site-on-primary:#FFFFFF;
  --site-secondary:#DFF7EF;
  --site-on-secondary:#163C35;
  --site-background:#F3F1FF;
  --site-on-background:#20213A;

  --site-font-body:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --radius-card:22px;
  --radius-btn:14px;
  --shadow-card:0 4px 20px rgba(91,75,219,.10), 0 1px 4px rgba(0,0,0,.06);
  --shadow-card-hover:0 12px 36px rgba(91,75,219,.18), 0 2px 8px rgba(0,0,0,.08);
  --transition-fast:.15s ease;
  --transition-med:.25s ease;

  color-scheme:light dark;
}

*, *::before, *::after { box-sizing:border-box; }
body {
  margin:0;
  font-family:var(--site-font-body);
  background:var(--site-background);
  color:var(--site-on-background);
  -webkit-font-smoothing:antialiased;
}
#app {
  background:var(--site-background);
  color:var(--site-on-background);
  min-height:100vh;
}

/* ═══════════════════════════════════════════════════════════════
   HEADER & NAVEGACIÓN (homologado con index.html)
═══════════════════════════════════════════════════════════════ */
header {
  background: linear-gradient(135deg, #5B4BDB 0%, #7c6ff0 60%, #9c8fff 100%);
  color:var(--site-on-primary);
  padding:0 max(22px, calc((100vw - 1160px) / 2));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  height:68px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 16px rgba(91,75,219,.28);
}
.logo {
  font-weight:900;
  font-size:1.35rem;
  letter-spacing:-.04em;
  display:flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
}
.logo .logo-icon {
  width:34px;
  height:34px;
  background:rgba(255,255,255,.18);
  border-radius:10px;
  display:grid;
  place-items:center;
  font-size:1.1rem;
  flex-shrink:0;
}
.logo span { color:#BDF5E3; }

.nav {
  display:flex;
  align-items:center;
  gap:4px;
  font-size:.9rem;
}
.nav a {
  color:rgba(255,255,255,.85);
  text-decoration:none;
  padding:7px 14px;
  border-radius:20px;
  font-weight:600;
  transition:background var(--transition-fast), color var(--transition-fast);
  white-space:nowrap;
}
.nav a:hover {
  background:rgba(255,255,255,.18);
  color:#fff;
  text-decoration:none;
}
.nav a:first-child {
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:.82rem;
  padding:6px 12px;
  border:1px solid rgba(255,255,255,.25);
}
.nav a:first-child:hover { background:rgba(255,255,255,.28); }

/* ═══════════════════════════════════════════════════════════════
   MAIN & CABECERA DE PÁGINA
═══════════════════════════════════════════════════════════════ */
main{max-width:860px;margin:0 auto;padding:48px 22px 70px}
.page-title{font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.045em;margin:0 0 6px;font-weight:900}
.page-sub{color:light-dark(#686980,#c6c6d9);margin:0 0 32px;font-size:.97rem}

/* ═══════════════════════════════════════════════════════════════
   LISTA DE JUEGOS (tarjetas homologadas con .game-card)
═══════════════════════════════════════════════════════════════ */
.games-list{display:flex;flex-direction:column;gap:14px}
.game-row{
  background:light-dark(#FFFFFF,#1e1e34);
  border:1.5px solid light-dark(#ede9ff,#2e2e4a);
  border-radius:var(--radius-card);
  padding:18px 22px;
  display:flex;
  align-items:center;
  gap:18px;
  box-shadow:var(--shadow-card);
  transition:transform var(--transition-med),box-shadow var(--transition-med),border-color var(--transition-med),opacity .2s;
  position:relative;
  overflow:hidden;
}
.game-row::before{
  content:'';
  position:absolute;
  top:0;left:0;bottom:0;
  width:4px;
  background:var(--card-accent,#5B4BDB);
  opacity:.75;
}
.game-row:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-card-hover);
  border-color:light-dark(#c8bfff,#4a4070);
}
.game-row.disabled-row{opacity:.5}
/* Acentos por juego (mismo criterio que index.html) */
#row-math    { --card-accent:#FF6B6B; }
#row-word    { --card-accent:#FF9F43; }
#row-memory  { --card-accent:#26de81; }
#row-trivia  { --card-accent:#45AAF2; }
#row-synonym { --card-accent:#FD79A8; }
#row-surprise{ --card-accent:#A29BFE; }
#row-match   { --card-accent:#0AB5D5; }
#row-vf      { --card-accent:#FDCB6E; }

.game-icon{height:52px;width:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.purple{background:#E9E5FF}.yellow{background:#FFF0C8}.green{background:#D9F7E9}.blue{background:#DCEEFF}.pink{background:#FFE1EC}
.game-info{flex:1;min-width:0}
.game-info h3{margin:0 0 3px;font-size:1.05rem;font-weight:800}
.game-info p{margin:0;font-size:.88rem;color:light-dark(#686980,#c6c6d9);line-height:1.5}

/* ── Toggle switch ── */
.toggle-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0}
.toggle-label{font-size:.75rem;font-weight:700;color:light-dark(#686980,#c6c6d9);text-transform:uppercase;letter-spacing:.06em}
.toggle{position:relative;display:inline-block;width:50px;height:28px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:light-dark(#D5D3EC,#44445d);border-radius:28px;cursor:pointer;transition:background .2s}
.slider:before{content:'';position:absolute;height:20px;width:20px;left:4px;top:4px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 4px #0002}
input:checked + .slider{background:#5B4BDB}
input:checked + .slider:before{transform:translateX(22px)}

/* ── Badges ── */
.badge{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
.badge.on{background:#D9F7E9;color:#1a7a4a}
.badge.off{background:#FFE1EC;color:#a5334d}

/* ═══════════════════════════════════════════════════════════════
   BARRA DE GUARDADO
═══════════════════════════════════════════════════════════════ */
.save-bar{position:sticky;bottom:0;background:light-dark(#F3F1FF,#131325);border-top:1px solid light-dark(#E7E5F3,#2a2a40);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 -22px -70px}
.save-bar p{margin:0;font-size:.9rem;color:light-dark(#686980,#c6c6d9)}

/* ═══════════════════════════════════════════════════════════════
   BOTONES (homologado con index.html)
═══════════════════════════════════════════════════════════════ */
.btn{
  border:0;
  border-radius:var(--radius-btn);
  padding:12px 22px;
  background:var(--site-primary);
  color:#fff;
  font-weight:800;
  font-size:.9rem;
  cursor:pointer;
  font-family:inherit;
  transition:transform var(--transition-fast),box-shadow var(--transition-fast),filter var(--transition-fast);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 14px rgba(91,75,219,.35)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn.secondary{background:light-dark(#EFEDFF,#39364f);color:light-dark(#5142c8,#ddd8ff);box-shadow:none}
.btn.secondary:hover{background:light-dark(#e4e0ff,#44415e);box-shadow:0 2px 8px rgba(91,75,219,.15)}

/* ═══════════════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════════════ */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#20213A;color:#fff;padding:12px 24px;border-radius:14px;font-size:.9rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:300;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══════════════════════════════════════════════════════════════
   FOOTER (homologado con index.html)
═══════════════════════════════════════════════════════════════ */
footer{text-align:center;padding:32px 22px;color:light-dark(#888,#b6b6ca);font-size:.83rem;border-top:1px solid light-dark(#e8e5f5,#2a2a40);margin-top:16px}
footer strong{color:var(--site-primary);font-weight:800}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════════════ */
@media(max-width:600px){
  main{padding:32px 16px 60px}
  header{height:58px}
  .game-row{flex-wrap:wrap}
  .toggle-wrap{flex-direction:row;gap:10px}
  .save-bar{flex-direction:column;align-items:stretch;text-align:center;margin:0 -16px -60px}
  .nav{gap:2px}
  .nav a:nth-child(3){display:none}
}

/* ═══════════════════════════════════════════════════════════════
   MODO OSCURO (homologado con index.html)
═══════════════════════════════════════════════════════════════ */
@media(prefers-color-scheme:dark){
  :root{--site-background:#131325;--site-on-background:#e8e8f5}
  body{background:#131325}
  .game-row{background:#1e1e34;border-color:#2a2a44}
  .nav a:first-child{border-color:rgba(255,255,255,.2)}
}
</style>
</head>
<body><div id="app">
<header>
  <a class="logo" href="index.html">
    <span class="logo-icon">✦</span>
    Aula<span>Play</span>
  </a>
  <nav class="nav">
    <a href="admin.html">⚙️ Administrar</a>
    <a href="index.html#juegos">Juegos</a>
    <a href="index.html#progreso">Mi progreso</a>
    <a href="index.html#acerca">Acerca de</a>
  </nav>
</header>
<main>
  <h1 class="page-title">⚙️ Administrar juegos</h1>
  <p class="page-sub">Activa o desactiva los juegos que aparecen en la página principal. Los cambios se aplican al guardar.</p>

  <div class="games-list" id="gamesList"></div>

  <div class="save-bar">
    <p id="statusMsg">Sin cambios pendientes.</p>
    <div style="display:flex;gap:10px">
      <button class="btn secondary" onclick="resetAll()">Activar todos</button>
      <button class="btn" onclick="saveSettings()">Guardar cambios</button>
    </div>
  </div>
</main>
<footer><strong>Aula Play</strong> ✦ · Panel de administración</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const GAMES = [
  { id:'math',     icon:'➗', color:'purple', name:'Reto matemático',         desc:'Resuelve operaciones y pon a prueba tu rapidez mental.' },
  { id:'word',     icon:'🔤', color:'yellow', name:'Palabra misteriosa',       desc:'Descubre la palabra usando una pista. ¡Cada letra cuenta!' },
  { id:'memory',   icon:'🧠', color:'green',  name:'Memoria Conceptual',       desc:'Asocia cada concepto con su respuesta y entrena tu memoria.' },
  { id:'trivia',   icon:'🌎', color:'blue',   name:'Alternativas',             desc:'Elige la respuesta correcta entre cuatro opciones.' },
  { id:'synonym',  icon:'📖', color:'pink',   name:'Sinónimos exprés',         desc:'Amplía tu vocabulario eligiendo palabras con significado parecido.' },
  { id:'surprise', icon:'🎯', color:'purple', name:'Desafío sorpresa',         desc:'Una pregunta al azar para comprobar lo que sabes.' },
  { id:'match',    icon:'🖼️', color:'blue',   name:'Match: Imagen y concepto', desc:'Relaciona cada imagen con su concepto.' },
  { id:'vf',       icon:'✅',  color:'yellow', name:'Verdadero o falso',         desc:'Lee afirmaciones y decide si son verdaderas o falsas.' }
];

const STORAGE_KEY = 'karyplay_games';

function loadSettings() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : {};
  } catch { return {}; }
}

function isEnabled(id, settings) {
  return settings[id] !== false; // default: enabled
}

let current = loadSettings();
let saved   = loadSettings();
let dirty   = false;

function render() {
  const list = document.getElementById('gamesList');
  list.innerHTML = '';
  GAMES.forEach(g => {
    const on = isEnabled(g.id, current);
    const row = document.createElement('div');
    row.className = 'game-row' + (on ? '' : ' disabled-row');
    row.id = 'row-' + g.id;
    row.innerHTML = `
      <div class="game-icon ${g.color}">${g.icon}</div>
      <div class="game-info">
        <h3>${g.name} <span class="badge ${on ? 'on' : 'off'}" id="badge-${g.id}">${on ? 'Activo' : 'Inactivo'}</span></h3>
        <p>${g.desc}</p>
      </div>
      <div class="toggle-wrap">
        <span class="toggle-label">${on ? 'ON' : 'OFF'}</span>
        <label class="toggle" aria-label="Activar ${g.name}">
          <input type="checkbox" id="toggle-${g.id}" ${on ? 'checked' : ''} onchange="toggle('${g.id}')">
          <span class="slider"></span>
        </label>
      </div>`;
    list.appendChild(row);
  });
  updateStatus();
}

function toggle(id) {
  const checked = document.getElementById('toggle-' + id).checked;
  current[id] = checked;
  const row   = document.getElementById('row-' + id);
  const badge = document.getElementById('badge-' + id);
  const label = row.querySelector('.toggle-label');
  row.className = 'game-row' + (checked ? '' : ' disabled-row');
  badge.className = 'badge ' + (checked ? 'on' : 'off');
  badge.textContent = checked ? 'Activo' : 'Inactivo';
  label.textContent = checked ? 'ON' : 'OFF';
  dirty = true;
  updateStatus();
}

function updateStatus() {
  const pending = GAMES.filter(g => current[g.id] !== saved[g.id]).length;
  document.getElementById('statusMsg').textContent =
    pending > 0
      ? `${pending} cambio${pending > 1 ? 's' : ''} sin guardar.`
      : 'Sin cambios pendientes.';
}

function saveSettings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
    saved  = { ...current };
    dirty  = false;
    showToast('✅ Cambios guardados correctamente.');
    updateStatus();
  } catch {
    showToast('❌ Error al guardar. Verifica que las cookies estén habilitadas.');
  }
}

function resetAll() {
  GAMES.forEach(g => { current[g.id] = true; });
  render();
  dirty = true;
  updateStatus();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Warn before leaving with unsaved changes
window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

render();
</script>
</body></html>
