  <path d="M150 90 Q160 110 175 130 Q185 148 170 165" fill="none" stroke="#ff6600" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 90 Q138 112 128 135 Q118 152 132 168" fill="none" stroke="#e84a0c" stroke-width="6" stroke-linecap="round"/>
  <!-- Base tierra -->
  <rect x="0" y="170" width="300" height="30" fill="#6b4423" rx="0"/>
