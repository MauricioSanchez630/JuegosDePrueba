<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#f0e8ff" rx="16"/>
  <!-- Membrana celular -->
  <ellipse cx="150" cy="98" rx="115" ry="78" fill="#d4b8ff" stroke="#7c4dff" stroke-width="3"/>
  <!-- Núcleo -->
  <ellipse cx="148" cy="95" rx="42" ry="34" fill="#9c6fff" opacity=".85" stroke="#5B4BDB" stroke-width="2"/>
  <!-- Nucléolo -->
  <ellipse cx="148" cy="95" rx="18" ry="14" fill="#5B4BDB" opacity=".8"/>
  <!-- Mitocondria -->
  <ellipse cx="215" cy="75" rx="20" ry="10" fill="#ff8fab" stroke="#d64f72" stroke-width="1.5" transform="rotate(20 215 75)"/>
  <line x1="197" y1="70" x2="233" y2="80" stroke="#d64f72" stroke-width="1" transform="rotate(20 215 75)"/>
  <!-- Vacuola -->
  <ellipse cx="95" cy="120" rx="22" ry="18" fill="#b8f0ff" stroke="#3aa0c0" stroke-width="1.5"/>
  <!-- Ribosomas (puntos) -->
  <circle cx="185" cy="115" r="4" fill="#7c4dff" opacity=".7"/>
  <circle cx="175" cy="130" r="3.5" fill="#7c4dff" opacity=".6"/>
  <circle cx="200" cy="128" r="3" fill="#7c4dff" opacity=".6"/>
  <text x="150" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a1a9a" font-weight="bold">Célula</text>
</svg>
